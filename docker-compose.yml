# Shared MCP server build definition (top-level extension)
x-mcp-server: &mcp-server-base
  build:
    context: ./mcp-server
    dockerfile: Dockerfile
  volumes:
    - ./keys:/app/keys:ro
  restart: unless-stopped
  user: "node"
  mem_limit: 256m
  cpus: '0.5'
  cap_drop:
    - ALL

services:
  mcp-server:
    <<: *mcp-server-base
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      EXTERNAL_URL: ${EXTERNAL_URL:-http://localhost:8081}
      ENABLE_APP_ID: ${ENABLE_APP_ID:-}
      ENABLE_PRIVATE_KEY_PATH: ${ENABLE_PRIVATE_KEY_PATH:-/app/keys/enablebanking_private.pem}
      ENABLE_API_BASE_URL: ${ENABLE_API_BASE_URL:-https://api.enablebanking.com}
      DATA_DIR: /app/data
      MCP_TOKEN: ${MCP_TOKEN:-adhd_budget_secret_token_2026}
    ports:
      - "8081:8081"
    volumes:
      - ./keys:/app/keys:ro
      - mcp_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile.caddy-secure
    ports:
      - "80:80"
    volumes:
      - ${CADDYFILE:-./Caddyfile.prod}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.25'
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - mcp-server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  mcp_data:

networks:
  default:
    name: adhd_budget_network
