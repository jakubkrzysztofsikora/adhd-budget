services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      EXTERNAL_URL: "https://adhdbudget.bieda.it"
      ENABLE_APP_ID: "bcf698e4-54af-4c2f-8a5e-bf080d77df47"
      ENABLE_PRIVATE_KEY_PATH: "/app/keys/enablebanking_private.pem"
      ENABLE_API_BASE_URL: "https://api.enablebanking.com"
      DATA_DIR: "/app/data"
      MCP_TOKEN: "${MCP_TOKEN:-adhd_budget_secret_token_2026}"
      SCW_SECRET_KEY: "dc98daf7-3f48-4eea-b1b4-1fb837b2e10d"
      SCW_PROJECT_ID: "44a22077-f6f9-4904-8b9c-7371fe6a3bb9"
      EMAIL_SENDER: "budget@assistant.jakub.team"
      EMAIL_RECIPIENTS: "sikora@jakub.team, arletarynk@gmail.com"
      DIGEST_CRON_HOUR: "21"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys:ro
    mem_limit: 512m
    cpus: '0.75'

  reverse-proxy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.25'
    depends_on:
      - mcp-server

volumes:
  caddy_data:
  caddy_config:
