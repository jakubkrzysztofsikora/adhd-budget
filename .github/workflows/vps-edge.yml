name: VPS Edge Operations

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command or action to run on VPS'
        required: true
        default: 'inspect'
        type: string

jobs:
  run-vps:
    name: Execute on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Run command via SSH
        uses: appleboy/ssh-action@v0.1.8
        env:
          CMD_INPUT: ${{ inputs.command }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: CMD_INPUT
          script: |
            set -e
            echo "=== RUNNING COMMAND ON VPS ==="
            echo "User: $(whoami)"
            echo "Hostname: $(hostname)"
            echo "IP: $(hostname -I 2>/dev/null || true)"
            
            if [ "$CMD_INPUT" = "inspect" ]; then
              echo "=== DOCKER CONTAINERS ==="
              docker ps -a
              
              echo "=== TAILSCALE STATUS ==="
              tailscale status 2>&1 || echo "tailscale CLI not found or inactive"
              
              echo "=== CONNECTIVITY TO K3S (100.69.232.58:30081) ==="
              curl -s -o /dev/null -w "K3S Health HTTP Status: %{http_code}\n" --connect-timeout 5 http://100.69.232.58:30081/health || echo "Direct curl to k3s failed"
              
              echo "=== CHECKING OLD SESSIONS.DB ON VPS ==="
              find /home/${USER}/adhd-budget /var/lib/docker/volumes/ -name "sessions.db" -o -name "oauth.db" 2>/dev/null || true
              
              if docker ps -q --filter name=mcp-server | grep -q .; then
                echo "=== DUMPING SESSIONS FROM RUNNING MCP CONTAINER ==="
                docker exec $(docker ps -q --filter name=mcp-server | head -1) ls -la /app/data/ 2>/dev/null || true
              fi
            elif [ "$CMD_INPUT" = "deploy-edge" ]; then
              echo "=== TEARING DOWN MONOLITHIC BACKEND ON VPS ==="
              cd /home/${USER}/adhd-budget
              docker compose down --remove-orphans || true
              docker rm -f adhd-budget-mcp-server-1 adhd-budget-db-1 adhd-budget-redis-1 adhd-budget-reverse-proxy-1 2>/dev/null || true
              docker volume rm adhd-budget_mcp_data 2>/dev/null || true
              rm -rf keys/ .env

              echo "=== WRITING EDGE CADDYFILE ==="
              cat << 'CADDY_EOF' > Caddyfile
:80 {
    header {
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "strict-origin-when-cross-origin"
    }

    handle /health {
        reverse_proxy http://100.69.232.58:30081
    }

    handle /mcp* {
        reverse_proxy http://100.69.232.58:30081 {
            flush_interval -1
            header_up Accept-Encoding identity
            header_down Cache-Control no-cache
            header_down X-Accel-Buffering no
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /.well-known/* {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /authorize {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /token {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /register {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /revoke {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /auth/* {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /connect* {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle /debug/* {
        reverse_proxy http://100.69.232.58:30081 {
            header_up X-Forwarded-Proto https
            header_up X-Forwarded-Host {host}
        }
    }

    handle {
        respond "ADHD Budget Assistant Edge" 200
    }
}
CADDY_EOF

              echo "=== WRITING DOCKER-COMPOSE.YML FOR EDGE ==="
              cat << 'COMPOSE_EOF' > docker-compose.yml
services:
  reverse-proxy:
    image: caddy:2-alpine
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.25'

volumes:
  caddy_data:
  caddy_config:
COMPOSE_EOF

              echo "=== STARTING EDGE PROXY CONTAINER ==="
              docker compose up -d --force-recreate
              sleep 3
              docker ps
            else
              echo "Executing custom command: $CMD_INPUT"
              eval "$CMD_INPUT"
            fi
